<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記帳本 / 가계부</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #f8f2e7;
    --surface-2:      #efe6d5;
    --text-primary:   #2e2a22;
    --text-secondary: #6e6353;
    --text-muted:     #a0947e;
    --gridline:       #e3d7c1;
    --baseline:       #cdbc9e;
    --border:         rgba(46,42,34,0.12);
    --card-bg:        #fffcf6;
    --accent:         #a97c50;
    --accent-hover:   #8f6740;

    --series-1: #2a78d6; /* blue */
    --series-2: #eb6834; /* orange */
    --series-3: #1baf7a; /* aqua */
    --series-4: #eda100; /* yellow */
    --series-5: #e87ba4; /* magenta */
    --series-6: #008300; /* green */
    --series-7: #4a3aa7; /* violet */
    --series-8: #e34948; /* red */

    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
  }
  :root[data-theme="dark"] .viz-root,
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      --surface-1:      #201b13;
      --surface-2:      #16130d;
      --text-primary:   #f5efe1;
      --text-secondary: #cabfa8;
      --text-muted:     #93876f;
      --gridline:       #332c20;
      --baseline:       #453b29;
      --border:         rgba(255,255,255,0.10);
      --card-bg:        #292117;
      --accent:         #c99b6e;
      --accent-hover:   #d8ac80;

      --series-1: #3987e5;
      --series-2: #d95926;
      --series-3: #199e70;
      --series-4: #c98500;
      --series-5: #d55181;
      --series-6: #008300;
      --series-7: #9085e9;
      --series-8: #e66767;

      --good: #0ca30c;
      --warning: #fab219;
      --serious: #ec835a;
      --critical: #e66767;
    }
  }
  :root[data-theme="dark"] .viz-root {
    --surface-1:      #201b13;
    --surface-2:      #16130d;
    --text-primary:   #f5efe1;
    --text-secondary: #cabfa8;
    --text-muted:     #93876f;
    --gridline:       #332c20;
    --baseline:       #453b29;
    --border:         rgba(255,255,255,0.10);
    --card-bg:        #292117;
    --accent:         #c99b6e;
    --accent-hover:   #d8ac80;

    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--surface-2);
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  body { padding-bottom: 60px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }

  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface-1);
    border-bottom: 1px solid var(--border);
  }
  .topbar-inner {
    max-width: 960px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .topbar-inner h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  button {
    font-family: inherit; font-size: 14px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card-bg);
    color: var(--text-primary); border-radius: 8px; padding: 7px 12px;
  }
  button:hover { filter: brightness(0.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); filter: none; }
  button.danger { color: var(--critical); }
  button.icon-btn { padding: 6px 8px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  nav.tabs {
    display: flex; gap: 4px; margin: 16px 0; overflow-x: auto;
  }
  nav.tabs button {
    background: transparent; border: none; padding: 8px 14px;
    border-radius: 999px; color: var(--text-secondary); font-weight: 600; white-space: nowrap;
  }
  nav.tabs button.active { background: var(--accent); color: #fff; }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(46,42,34,0.05), 0 1px 2px rgba(46,42,34,0.04);
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--text-secondary); font-weight: 700; }

  .month-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px; }
  .month-nav .month-label { font-size: 17px; font-weight: 700; min-width: 110px; text-align: center; }

  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat-tile { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(46,42,34,0.05), 0 1px 2px rgba(46,42,34,0.04); }
  .stat-tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .stat-tile .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-tile.income .value { color: var(--series-1); }
  .stat-tile.expense .value { color: var(--series-2); }
  .stat-tile.balance .value.neg { color: var(--critical); }
  .stat-tile.balance .value.pos { color: var(--good); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) {
    .grid-2 { grid-template-columns: 1fr; }
    .stat-row { grid-template-columns: 1fr; }
  }

  .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 10px; font-size: 12.5px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

  .donut-wrap { display: flex; flex-direction: column; align-items: center; }
  .donut-empty { color: var(--text-muted); font-size: 13px; padding: 40px 0; text-align: center; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 100;
    background: var(--text-primary); color: var(--surface-1);
    font-size: 12px; padding: 6px 9px; border-radius: 6px;
    transform: translate(-50%, -120%); white-space: nowrap;
    opacity: 0; transition: opacity 0.1s;
  }
  .tooltip.show { opacity: 1; }

  form.tx-form { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: end; }
  form.tx-form .field { display: flex; flex-direction: column; gap: 4px; }
  form.tx-form label { font-size: 12px; color: var(--text-muted); }
  form.tx-form input, form.tx-form select {
    font-family: inherit; font-size: 14px; padding: 8px 9px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-1); color: var(--text-primary);
  }
  form.tx-form .field.wide { grid-column: span 2; }
  form.tx-form .field.full { grid-column: 1 / -1; }
  @media (max-width: 720px) {
    form.tx-form { grid-template-columns: 1fr 1fr; }
    form.tx-form .field.wide, form.tx-form .field.full { grid-column: 1 / -1; }
  }

  .type-toggle { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .type-toggle button { border: none; border-radius: 0; flex: 1; background: var(--surface-1); }
  .type-toggle button.on.expense { background: var(--series-2); color: #fff; }
  .type-toggle button.on.income { background: var(--series-1); color: #fff; }

  .filters { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .filters select, .filters input { font-family: inherit; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); font-size: 13px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th { text-align: left; color: var(--text-muted); font-weight: 600; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--gridline); }
  tbody td { padding: 8px 8px; border-bottom: 1px solid var(--gridline); vertical-align: middle; }
  tbody tr:hover { background: var(--surface-2); }
  td.amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  td.amt.income { color: var(--series-1); }
  td.amt.expense { color: var(--series-2); }
  .cat-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); }
  .cat-pill .swatch { width: 8px; height: 8px; }
  .row-actions { display: flex; gap: 4px; justify-content: flex-end; }
  .row-actions button { padding: 4px 7px; font-size: 12px; }
  .empty-state { text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 13.5px; }

  .budget-row { padding: 12px 0; border-bottom: 1px solid var(--gridline); }
  .budget-row:last-child { border-bottom: none; }
  .budget-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 13.5px; }
  .budget-head .status-badge { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
  .progress-track { height: 8px; border-radius: 999px; background: var(--gridline); overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; }
  .budget-input-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .budget-input-row input { width: 130px; font-family: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); font-size: 13px; }
  .sub-note { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .cat-manage-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .cat-manage-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
  .cat-manage-row .swatch { width: 10px; height: 10px; }
  .cat-manage-row .name { flex: 1; font-size: 13.5px; }
  .add-cat-form { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add-cat-form input, .add-cat-form select { font-family: inherit; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); font-size: 13px; }

  footer.hint { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 20px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--surface-1); padding: 10px 18px;
    border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .gate {
    position: fixed; inset: 0; z-index: 500;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .gate-box {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px 28px; max-width: 320px; width: 100%;
    box-shadow: 0 8px 30px rgba(46,42,34,0.12); text-align: center;
  }
  .gate-box .icon { font-size: 32px; margin-bottom: 10px; }
  .gate-box h2 { margin: 0 0 6px; font-size: 17px; }
  .gate-box p { margin: 0 0 18px; font-size: 13px; color: var(--text-muted); }
  .gate-box input {
    width: 100%; font-family: inherit; font-size: 18px; text-align: center;
    letter-spacing: 4px; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
    margin-bottom: 12px;
  }
  .gate-box input.shake { animation: gate-shake 0.35s; border-color: var(--critical); }
  .gate-box button { width: 100%; padding: 10px; }
  @keyframes gate-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
<div class="viz-root">

<div class="gate" id="gate">
  <div class="gate-box">
    <div class="icon">🔒</div>
    <h2>記帳本 / 가계부</h2>
    <p>請輸入密碼以繼續 / 비밀번호를 입력하세요</p>
    <form id="gateForm">
      <input type="password" id="gatePassword" inputmode="numeric" autocomplete="off" placeholder="••••" autofocus>
      <button type="submit" class="primary">解鎖 / 잠금 해제</button>
    </form>
  </div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <h1>📒 記帳本 / 가계부</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" title="切換深色模式 / 다크 모드 전환">🌙</button>
      <button id="exportBtn" title="匯出完整備份 JSON（含分類與預算設定，可用於還原） / 전체 백업 내보내기">備份匯出 / 백업 내보내기</button>
      <button id="importBtn" title="匯入備份 JSON 還原資料 / 백업 JSON 가져오기">備份匯入 / 백업 가져오기</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs">
    <button data-tab="dashboard" class="active">總覽 / 개요</button>
    <button data-tab="records">記錄 / 기록</button>
    <button data-tab="budget">預算 / 예산</button>
    <button data-tab="categories">分類設定 / 분류 설정</button>
  </nav>

  <!-- Dashboard -->
  <section class="panel active" id="panel-dashboard">
    <div class="month-nav">
      <button id="prevMonth">‹</button>
      <div class="month-label" id="monthLabel">2026年8月</div>
      <button id="nextMonth">›</button>
    </div>

    <div class="stat-row">
      <div class="stat-tile income">
        <div class="label">本月收入 / 이번 달 수입</div>
        <div class="value" id="statIncome">₩0</div>
      </div>
      <div class="stat-tile expense">
        <div class="label">本月支出 / 이번 달 지출</div>
        <div class="value" id="statExpense">₩0</div>
      </div>
      <div class="stat-tile balance">
        <div class="label">本月結餘 / 이번 달 잔액</div>
        <div class="value" id="statBalance">₩0</div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>本月支出分類 / 이번 달 지출 분류</h2>
        <div id="donutContainer" class="donut-wrap"></div>
      </div>
      <div class="card">
        <h2>近 6 個月收支趨勢 / 최근 6개월 수입·지출 추이</h2>
        <div id="barContainer"></div>
      </div>
    </div>

    <div class="card" id="dashboardBudgetCard" style="display:none;">
      <h2>預算狀況 / 예산 현황</h2>
      <div id="dashboardBudgetList"></div>
    </div>
  </section>

  <!-- Records -->
  <section class="panel" id="panel-records">
    <div class="card">
      <h2 id="formTitle">新增紀錄 / 기록 추가</h2>
      <form class="tx-form" id="txForm">
        <div class="field wide">
          <label>類型 / 유형</label>
          <div class="type-toggle">
            <button type="button" data-type="expense" class="on expense">支出 / 지출</button>
            <button type="button" data-type="income" class="income">收入 / 수입</button>
          </div>
        </div>
        <div class="field">
          <label>金額 (₩) / 금액 (₩)</label>
          <input type="number" id="txAmount" min="0" step="1" placeholder="0" required>
        </div>
        <div class="field">
          <label>分類 / 분류</label>
          <select id="txCategory" required></select>
        </div>
        <div class="field">
          <label>日期 / 날짜</label>
          <input type="date" id="txDate" required>
        </div>
        <div class="field wide">
          <label>備註（選填） / 메모 (선택)</label>
          <input type="text" id="txNote" placeholder="例如：午餐、捷運 / 예: 점심, 지하철">
        </div>
        <div class="field full" style="display:flex; gap:8px; justify-content:flex-end;">
          <button type="button" id="cancelEditBtn" style="display:none;">取消編輯 / 편집 취소</button>
          <button type="submit" class="primary" id="submitTxBtn">新增紀錄 / 기록 추가</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>所有紀錄 / 전체 기록</h2>
      <div class="filters">
        <select id="filterMonth"></select>
        <select id="filterType">
          <option value="all">全部類型 / 전체 유형</option>
          <option value="expense">支出 / 지출</option>
          <option value="income">收入 / 수입</option>
        </select>
        <select id="filterCategory"><option value="all">全部分類 / 전체 분류</option></select>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>日期 / 날짜</th><th>分類 / 분류</th><th>備註 / 메모</th><th style="text-align:right;">金額 / 금액</th><th></th></tr>
          </thead>
          <tbody id="txTableBody"></tbody>
        </table>
      </div>
      <div class="empty-state" id="txEmptyState" style="display:none;">目前沒有符合條件的紀錄 / 조건에 맞는 기록이 없습니다</div>
    </div>
  </section>

  <!-- Budget -->
  <section class="panel" id="panel-budget">
    <div
